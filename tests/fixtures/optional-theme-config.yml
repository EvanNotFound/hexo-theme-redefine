theme_config:
  global:
    scroll_progress:
      bar: true
      percentage: false
    preloader:
      enable: true
      custom_message: Optional feature check
  navbar:
    search:
      enable: true
      preload: true
  articles:
    style:
      delete_mask: true
      image_caption: true
    toc:
      title_max_length: 0
    code_block:
      highlight_theme:
        light: atom-one-light
        dark: nord
  comment:
    enable: true
    system: twikoo
  footer:
    runtime: false
  plugins:
    aplayer:
      enable: true
      type: fixed
