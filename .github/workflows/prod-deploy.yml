name: Prod Deploy
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  production-deployment:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://redefine.ohevan.com

    steps:
      - name: Checkout theme repository
        uses: actions/checkout@v6
        with:
          path: 'theme' # Checkout the theme repository into a directory named 'theme'

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          package-json-file: theme/package.json
          cache: true
          cache-dependency-path: theme/pnpm-lock.yaml
          install: false

      - name: Clone Hexo site repository
        run: git clone https://github.com/EvanNotFound/redefine-demo.git hexo-site

      - name: Move theme into Hexo site
        run: |
          mv theme hexo-site/themes/redefine

      - name: Install dependencies
        run: |
          cd hexo-site
          pnpm \
            install --no-frozen-lockfile --config.strict-dep-builds=false
          pnpm approve-builds \
            hexo-util \
            nodejieba \
            '!gifsicle' \
            '!jpegtran-bin' \
            '!mozjpeg' \
            '!optipng-bin' \
            '!pngquant-bin'

      - name: Build Hexo
        run: |
          cd hexo-site
          pnpm remove hexo-theme-redefine
          pnpm run build

      - name: Change directory to hexo-site
        run: echo "HEXO_SITE_DIR=${{ github.workspace }}/hexo-site" >> $GITHUB_ENV

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Deploy to Vercel Action
        uses: EvanNotFound/vercel-deployment-for-github-actions@v1.2.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          WORKING_DIRECTORY: ${{ env.HEXO_SITE_DIR }}
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          PRODUCTION: true
          GITHUB_DEPLOYMENT: false
          DEPLOY_PR_FROM_FORK: true
          PR_PREVIEW_DOMAIN: "redefine-preview-pr-{PR}.vercel.app"
