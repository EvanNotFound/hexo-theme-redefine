name: Prod Deploy
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
on:
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  production-deployment:
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://redefine.ohevan.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build theme assets
        run: pnpm build

      - name: Configure Production Mode
        run: node dev/site-mode.mjs production

      - name: Link Local Theme
        run: node dev/link-theme.mjs

      - name: Build Hexo Site
        run: pnpm --dir dev/site exec hexo generate

      - name: Prepare Vercel Prebuilt Output
        run: |
          mkdir -p dev/site/.vercel/output/static
          printf '{"version":3}' > dev/site/.vercel/output/config.json
          cp -R dev/site/public/. dev/site/.vercel/output/static/

      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      - name: Deploy to Vercel Action
        uses: EvanNotFound/vercel-deployment-for-github-actions@v1.2.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          WORKING_DIRECTORY: ${{ github.workspace }}/dev/site
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          PRODUCTION: true
          GITHUB_DEPLOYMENT: false
          PREBUILT: true
          DEPLOY_PR_FROM_FORK: true
          PR_PREVIEW_DOMAIN: "redefine-preview-pr-{PR}.vercel.app"
