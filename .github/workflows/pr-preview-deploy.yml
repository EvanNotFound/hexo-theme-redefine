name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["PR Preview Build"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr-preview-deploy-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    environment:
      name: PR Preview
      url: ${{ steps.deploy-to-vercel.outputs.PREVIEW_URL }}

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.x'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Resolve PR Info
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run
            const { owner, repo } = context.repo
            const workflowRunPr = run.pull_requests && run.pull_requests[0]
            const runHeadSha = run.head_sha || (workflowRunPr && workflowRunPr.head && workflowRunPr.head.sha)
            let pr = workflowRunPr || null

            if (!pr && runHeadSha) {
              try {
                const { data: prsByCommit } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                  owner,
                  repo,
                  commit_sha: runHeadSha,
                  per_page: 100,
                })
                pr = prsByCommit.find((item) => item.head && item.head.sha === runHeadSha) || prsByCommit[0] || null
              } catch (error) {
                core.warning(`Failed to resolve PR by commit ${runHeadSha}: ${error.message}`)
              }
            }

            if (!pr) {
              const headOwner = run.head_repository && run.head_repository.owner && run.head_repository.owner.login
              const headBranch = run.head_branch
              if (headOwner && headBranch) {
                try {
                  const prsByHead = await github.paginate(github.rest.pulls.list, {
                    owner,
                    repo,
                    head: `${headOwner}:${headBranch}`,
                    state: "all",
                    per_page: 100,
                  })
                  pr = prsByHead.find((item) => item.head && item.head.sha === runHeadSha) || prsByHead[0] || null
                } catch (error) {
                  core.warning(
                    `Failed to resolve PR by head ${headOwner}:${headBranch}: ${error.message}`,
                  )
                }
              }
            }

            if (!pr) {
              const runHeadRepo = run.head_repository && run.head_repository.full_name
              core.setFailed(
                `No PR found for workflow run ${run.id}. head_sha=${runHeadSha || "unknown"}, head_branch=${run.head_branch || "unknown"}, head_repository=${runHeadRepo || "unknown"}`,
              )
              return
            }
            core.setOutput("number", String(pr.number))
            core.setOutput("head_sha", (pr.head && pr.head.sha) || runHeadSha || "")

      - name: Download Prebuilt Artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-prebuilt
          path: vercel-prebuilt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Extract Prebuilt Output
        run: |
          mkdir -p deploy
          tar -xzf vercel-prebuilt/vercel-prebuilt.tgz -C deploy

      # Install Vercel CLI first to avoid bug with next step
      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest


      - name: Deploy to Vercel
        id: deploy-to-vercel
        uses: EvanNotFound/vercel-deployment-for-github-actions@v1.2.2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          WORKING_DIRECTORY: deploy
          VERCEL_SCOPE: ${{ secrets.VERCEL_SCOPE }}
          PRODUCTION: false
          GITHUB_DEPLOYMENT: false
          PREBUILT: true
          DEPLOY_PR_FROM_FORK: true
          ALIAS_DOMAINS: |
            redefine-preview-pr-${{ steps.pr.outputs.number }}.vercel.app

      - name: Comment Preview URL
        if: ${{ steps.deploy-to-vercel.outputs.PREVIEW_URL != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number("${{ steps.pr.outputs.number }}")
            const previewUrl = "${{ steps.deploy-to-vercel.outputs.PREVIEW_URL }}"
            const marker = "<!-- vercel-preview -->"
            const body = `${marker}\nPreview: ${previewUrl}`
            const { owner, repo } = context.repo
            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
            })
            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              })
            }
