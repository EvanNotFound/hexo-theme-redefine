name: PR Preview Build

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Theme Repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.x"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Enable Developer Mode and Disable CDN
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          python <<'PY'
          import yaml
          from pathlib import Path

          config_path = Path("dev/site/_config.redefine.yml")
          data = yaml.safe_load(config_path.read_text()) or {}
          data.setdefault("developer", {})
          data["developer"]["enable"] = True
          data.setdefault("cdn", {})
          data["cdn"]["enable"] = False
          config_path.write_text(
              yaml.safe_dump(data, default_flow_style=False, sort_keys=False)
          )
          PY

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Theme Assets
        run: pnpm run build

      - name: Clean Demo Site
        run: pnpm clean

      - name: Link Local Theme
        run: node dev/link-theme.mjs

      - name: Build Hexo Site
        run: pnpm --dir dev/site exec hexo generate

      - name: Prepare Vercel Prebuilt Output
        run: |
          mkdir -p dev/site/.vercel/output/static
          printf '{"version":3}' > dev/site/.vercel/output/config.json
          cp -R dev/site/public/. dev/site/.vercel/output/static/

      - name: Package Vercel Prebuilt Output
        run: tar -C dev/site -czf vercel-prebuilt.tgz .vercel/output

      - name: Upload Vercel Prebuilt Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt
          path: vercel-prebuilt.tgz
          if-no-files-found: error
          retention-days: 7
