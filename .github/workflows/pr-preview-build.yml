name: PR Preview Build

on:
  pull_request:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: pr-preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Theme Repository
        uses: actions/checkout@v6

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Theme Assets
        run: pnpm build

      - name: Configure Preview Mode
        run: node dev/site-mode.mjs preview

      - name: Link Local Theme
        run: node dev/link-theme.mjs

      - name: Build Hexo Site
        run: pnpm --dir dev/site exec hexo generate

      - name: Prepare Vercel Prebuilt Output
        run: |
          mkdir -p dev/site/.vercel/output/static
          printf '{"version":3}' > dev/site/.vercel/output/config.json
          cp -R dev/site/public/. dev/site/.vercel/output/static/

      - name: Package Vercel Prebuilt Output
        run: tar -C dev/site -czf vercel-prebuilt.tgz .vercel/output

      - name: Upload Vercel Prebuilt Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-prebuilt
          path: vercel-prebuilt.tgz
          if-no-files-found: error
          retention-days: 7
