name: PR Build Check

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'source/js/**'
      - 'source/css/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'dev/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for committed build artifacts
        run: |
          git fetch origin "${{ github.base_ref }}"
          if git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep -qE '^source/(js/build/|css/build/)'; then
            echo "::error::Build artifacts are not allowed in PRs."
            echo "Remove files under source/js/build or source/css/build from the commit."
            exit 1
          fi

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - name: Build Project
        run: pnpm run build
